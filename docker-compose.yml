services:
    web:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: password-management
        depends_on:
            - db
        ports:
            - 8000:80
    # The database service is untouched by the migration (spec #1):
    # same image, credentials, and host port as the pre-migration stack.
    db:
        container_name: pass-manag-db
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: password_manager
            MYSQL_USER: latihan
            MYSQL_PASSWORD: latihan
        ports:
            - 6036:3306
